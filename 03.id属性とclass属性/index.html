<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
  <title>cssハンズオン</title>
  <style>
    .blue-bg { background-color: blue;}
    .gray-bg { background-color: gray;}
    .green-bg { background-color: green;}
    .brown-bg { background-color: brown;}

    .white { color: white;}
    .yellow { color: yellow;}
    .red { color: red;}
    .blue { color: blue}

    .size16 { font-size: 16px;}
    .size12 { font-size: 12px;}

    #red-message {
      background-color: blue;
      color: red;
    }

  </style>
</head>
<body>
  <h1>CSSハンズオン</h1>
  <h3>Part3</h3>
  <p class="blue-bg white">背景色は青色、文字色は白色ですよ</p>
  <p class="blue-bg white">背景色は青色、文字色は白色ですよ</p>
  <p class="blue-bg white">背景色は青色、文字色は白色ですよ</p>
  <p class="blue-bg yellow">背景色は青色、文字色は黄色ですよ</p>
  <p id="red-message">背景色は青色、文字色は赤色ですよ</p>
  <p class="blue-bg yellow">背景色は青色、文字色は黄色ですよ</p>
  <ul>
     <li class="yellow gray-bg size16">文字色は黄色、背景色は灰色、文字サイズは16px</li>
     <li class="blue gray-bg size16">文字色は青色、背景色は灰色、文字サイズは16px</li>
     <li class="red green-bg size16">文字色は赤色、背景色は緑色、文字サイズは16px</li>
     <li class="blue green-bg size16">文字色は青色、背景色は緑色、文字サイズは16px</li>
     <li class="yellow brown-bg size16">文字色は黄色、背景色は茶色、文字サイズは16px</li>
     <li class="red brown-bg size12">文字色は赤色、背景色は茶色、文字サイズは12px</li>
  </ul>
</body>
</html>
